services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons
    ports:
      - "8069:8069"
  bosta-mock:
    image: python:3.12-slim
    profiles: ["demo"]
    command: python /demo/bosta_mock.py
    volumes:
      - ./demo:/demo
